name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

jobs:
  test:
    runs-on: org-public

    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Check for debug build
        run: node scripts/check_debug_build.js

      - name: Install
        run: npm ci --include=dev

      - name: Install Playwright Dependencies
        run: npx playwright install --with-deps chromium firefox

      # run before "npm run build", as it regenerates the file to check
      - name: Check wasm version
        run: node scripts/check_wasm_version.js

      - name: Build
        run: npm run build

      - name: Test (Chrome)
        run: npm run test:auto
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READONLY }}

      - name: Test (Firefox)
        run: npm run test:firefox
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READONLY }}

  lint:
    runs-on: org-public
    steps:
      - uses: actions/checkout@v7

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install
        run: npm ci --include=dev

      - name: Check format
        run: npm run format:check
